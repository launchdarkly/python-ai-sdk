[project]
name = "launchdarkly-ai-langchain-agents"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "launchdarkly-ai-server>=0.6,<2",
  "opentelemetry-api>=1.25",
  "langchain>=1.0",
  "langchain-core>=1.6",
  "langgraph>=1.2",
  "langgraph-prebuilt>=1.1",
  "langchain-openai>=1.3",
]
description = "LangChain/LangGraph agent handler for LaunchDarkly AI SDK"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "LaunchDarkly", email = "team@launchdarkly.com"}]
keywords = ["launchdarkly", "ai", "langchain", "langgraph", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/launchdarkly/python-ai-sdk"
Repository = "https://github.com/launchdarkly/python-ai-sdk"
"Bug Tracker" = "https://github.com/launchdarkly/python-ai-sdk/issues"

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.4"]
aws = ["langchain-aws>=1.7"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchdarkly_ai_langchain_agents"]
