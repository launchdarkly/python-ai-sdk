[project]
name = "launchdarkly-ai-google-adk-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "launchdarkly-ai-server",
  "opentelemetry-api>=1.25",
]
# google-adk[extensions]>=2.9.2 is the runtime dependency. It is intentionally
# not declared yet: 2.9.2 caps opentelemetry-sdk<=1.42.1, which the workspace
# cannot solve next to opentelemetry-exporter-otlp-proto-http>=1.43.
description = "Google ADK agent handler for LaunchDarkly AI SDK"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "LaunchDarkly", email = "team@launchdarkly.com"}]
keywords = ["launchdarkly", "ai", "google-adk", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/launchdarkly/python-ai-sdk"
Repository = "https://github.com/launchdarkly/python-ai-sdk"
"Bug Tracker" = "https://github.com/launchdarkly/python-ai-sdk/issues"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchdarkly_ai_google_adk_agents"]
