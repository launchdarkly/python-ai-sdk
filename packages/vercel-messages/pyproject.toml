[project]
name = "launchdarkly-ai-vercel-messages"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "launchdarkly-ai-server",
  "opentelemetry-api>=1.25",
  "ai>=0.7",
]
description = "Vercel AI SDK messages handler for LaunchDarkly AI SDK"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "LaunchDarkly", email = "team@launchdarkly.com"}]
keywords = ["launchdarkly", "ai", "vercel", "messages"]

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchdarkly_ai_vercel_messages"]
