version: 2
updates:
  - package-ecosystem: 'uv'
    # uv workspace root: one uv.lock covers every packages/* member.
    directory: '/'
    # These are published libraries: keep each package's minimum version and
    # only widen a range when a new release falls outside it.
    versioning-strategy: 'increase-if-necessary'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows only; the composite actions pin their own actions.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
