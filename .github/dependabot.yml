version: 2
updates:
  - package-ecosystem: 'uv'
    # uv workspace root: one uv.lock covers every packages/* member.
    directory: '/'
    # These are published libraries: never change their version requirements,
    # only uv.lock. A release outside a range is a manual decision.
    versioning-strategy: 'lockfile-only'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
  - package-ecosystem: 'github-actions'
    # '/' covers .github/workflows only; the composite actions pin their own actions.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
